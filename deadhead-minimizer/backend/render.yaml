services:
  - type: web
    name: ddm-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ddm-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000
      # Add DAT_API_KEY, TWILIO_*, OPENAI_API_KEY here later if/when those
      # features get built — leave unset for now, they default to empty.

databases:
  - name: ddm-postgres
    plan: free
    postgresMajorVersion: 16
